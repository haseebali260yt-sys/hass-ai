<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hass.ai</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#0f1117;color:#fff;display:flex;flex-direction:column;height:100vh}
header{padding:12px 16px;background:#181b24;display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:20px}
#student{background:#2a2f3d;color:#fff;border:0;padding:8px 12px;border-radius:20px;cursor:pointer}
#student.on{background:#22c55e}
#chat{flex:1;overflow-y:auto;padding:16px}
.m{max-width:85%;margin:8px 0;padding:10px 14px;border-radius:14px;white-space:pre-wrap;line-height:1.4}
.u{background:#3b82f6;margin-left:auto}
.b{background:#232838}
footer{display:flex;gap:8px;padding:12px;background:#181b24}
input{flex:1;padding:12px;border-radius:24px;border:0;background:#2a2f3d;color:#fff;font-size:16px}
#send{background:#3b82f6;color:#fff;border:0;padding:0 18px;border-radius:24px;cursor:pointer}
</style></head><body>
<header><h1>hass.ai</h1><button id="student">Student Mode: OFF</button></header>
<div id="chat"><div class="m b">Salam! Main hass.ai hon. Kuch bhi pucho 😄</div></div>
<footer><input id="inp" placeholder="Message likho..."><button id="send">Send</button></footer>
<script>
let student=false, history=[];
const chat=document.getElementById("chat"), inp=document.getElementById("inp"), sb=document.getElementById("student");
sb.onclick=()=>{student=!student;sb.classList.toggle("on",student);sb.textContent="Student Mode: "+(student?"ON":"OFF")};
function add(t,c){const d=document.createElement("div");d.className="m "+c;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
async function send(){
  const t=inp.value.trim(); if(!t)return; inp.value="";
  add(t,"u"); history.push({role:"user",text:t});
  const w=add("Soch raha hon...","b");
  try{
    const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:history,student})});
    const d=await r.json(); w.textContent=d.reply||"Error aa gaya";
    history.push({role:"model",text:w.textContent});
  }catch(e){w.textContent="Net ka masla, dobara try karo."}
}
document.getElementById("send").onclick=send;
inp.addEventListener("keydown",e=>{if(e.key==="Enter")send()});
</script></body></html>
